name: BWMilsim CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: |
          node --check server.js
          node --check app.js
          node -e "const p=require('./package.json'); if(p.scripts.start !== 'node server.js') process.exit(1)"
