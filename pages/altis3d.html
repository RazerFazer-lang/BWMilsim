<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BWMilsim · Altis Karte</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#090e0a;--panel:#0d140fdd;--line:#354238;--text:#e7eee5;--muted:#89968c;--accent:#b9d765}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:14px/1.4 Inter,Segoe UI,system-ui,sans-serif}.shell{position:fixed;inset:0}.top{position:absolute;z-index:1000;top:12px;left:50%;transform:translateX(-50%);width:min(1500px,calc(100% - 24px));padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);backdrop-filter:blur(9px);display:flex;justify-content:space-between;align-items:center;box-shadow:0 12px 40px #0008}.brand b{display:block;letter-spacing:.08em}.brand span{display:block;color:var(--muted);font-size:9px;letter-spacing:.13em}.live{color:var(--accent);font-size:10px;font-weight:800}.map{position:absolute;inset:0}.leaflet-container{background:#12252a}.toolbar{position:absolute;z-index:1000;top:78px;left:18px;display:flex;gap:7px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#0b120dec;color:#e3eae2;border-radius:7px;padding:8px 10px;font:11px Inter,Segoe UI,system-ui;cursor:pointer;box-shadow:0 5px 20px #0005}.btn:hover,.btn.active{border-color:#718c4b;color:#c7de7b;background:#182018}.info{position:absolute;z-index:1000;right:18px;top:78px;max-width:360px;padding:10px 12px;border:1px solid var(--line);background:#0b120dec;border-radius:8px;color:#b7c2b8;font-size:10px;box-shadow:0 5px 20px #0005}.info b{color:#e7eee5}.coord{position:absolute;z-index:1000;left:18px;bottom:18px;padding:8px 10px;border:1px solid var(--line);background:#0b120dec;border-radius:8px;color:#cbd6ca;font:11px ui-monospace,SFMono-Regular,Consolas,monospace;box-shadow:0 5px 20px #0005}.leaflet-control-zoom{border:1px solid var(--line)!important;box-shadow:0 5px 20px #0006!important}.leaflet-control-zoom a{background:#0b120dec!important;color:#dce5da!important;border-color:var(--line)!important}.leaflet-control-attribution{background:#0b120dcc!important;color:#a9b5aa!important}.leaflet-control-attribution a{color:#c2d775!important}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#0b120dec;color:#e7eee5;border:1px solid var(--line)}.city-label{background:#0a110de8;border:1px solid #495845;border-radius:5px;color:#e0e8de;padding:3px 6px;font-size:10px;font-weight:700;box-shadow:0 3px 10px #0005}.city-label:before{display:none}
</style>
</head>
<body>
<div class="shell">
<header class="top"><div class="brand"><b>BWMilsim</b><span>ARMA 3 · ECHTE ALTIS LAGEKARTE</span></div><div class="live">ALTIS MAP ONLINE</div></header>
<div class="toolbar"><button class="btn active" id="cities">ORTSLABELS</button><button class="btn active" id="grid">GRID</button><button class="btn" id="full">VOLLBILD</button><button class="btn" id="reset">ALTIS ZENTRIEREN</button></div>
<div class="info"><b>ORIGINAL ALTIS KARTENBASIS</b><br>Die Karte nutzt die veröffentlichten Altis-Kartentiles des Arma3Map-Projekts. BWMilsim legt keine eigene Insel nach.</div>
<div id="map" class="map"></div><div id="coord" class="coord">Cursor: —</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const ALTIS={center:[15000,15000],minZoom:0,maxZoom:6,defaultZoom:3,tileSize:212,base:'https://jetelain.github.io/Arma3Map/maps/altis/{z}/{x}/{y}.png'};
const cities=[['Therisa',10618.9,12237.3],['Zaros',9091.81,11961.9],['Poliakko',10966.5,13435.3],['Katalaki',11701.1,13672.1],['Alikampos',11112.6,14573.7],['Neochori',12502,14337],['Stavros',12950.1,15041.6],['Lakka',12282,15732.3],['Agios Dionysios',9187.95,15947.8],['Panochori',5033.31,11245.2],['Topolia',7375.81,15429.5],['Ekali',17059.7,9992.32],['Pyrgos',16780.6,12604.5],['Orino',10410.4,17243.1],['Neri',4116.11,11736.1],['Kore',7062.42,16472.1],['Kavala',3458.95,12966.4],['Aggelochori',3687.78,13776.1],['Koroni',11786.7,18372.4],['Gravia',14479.8,17614.3],['Anthrakia',16584.3,16104],['Syrta',8625.13,18301.6],['Negades',4885.98,16171.3],['Galati',10270.3,19036],['Telos',16207,17296.7],['Charkia',18049.1,15264.1],['Athira',13993,18709.4],['Dorida',19336.9,13252.3],['Ifestiona',12787,19679.3],['Chalkeia',20194.6,11660.7],['Agios Konstantinos',3948.77,17277.8],['Abdera',9425.42,20284],['Panagia',20490.2,8907.12],['Nifi',19473.3,15453.7],['Rodopoli',18753.4,16597.1],['Kalithea',17826.5,18129.4],['Selakano',20769.8,6736.46],['Frini',14612.5,20786.7],['Agios Petros',19339.4,17641.6],['Feres',21640.7,7583.93],['Agia Triada',16668.5,20487],['Paros',20885.4,16958.8],['Kalochori',21351.6,16361.9],['Oreokastro',4560.45,21460.6],['Ioannina',23199.7,19986.6],['Delfinaki',23908.6,20144.7],['Sofia',25680.5,21365.1],['Molos',26943.9,23170.7]];
function MGRS_CRS(fx,fy,tileSize){return L.extend({},L.CRS.Simple,{projection:L.Projection.LonLat,transformation:new L.Transformation(fx,0,-fy,tileSize),scale:z=>Math.pow(2,z),zoom:s=>Math.log(s)/Math.LN2,distance:(a,b)=>Math.hypot(b.lng-a.lng,b.lat-a.lat),infinite:true})}
const map=L.map('map',{minZoom:ALTIS.minZoom,maxZoom:ALTIS.maxZoom,crs:MGRS_CRS(0.006839,0.006836,ALTIS.tileSize),zoomControl:true,preferCanvas:true});
L.tileLayer(ALTIS.base,{tileSize:ALTIS.tileSize,minZoom:ALTIS.minZoom,maxZoom:ALTIS.maxZoom,maxNativeZoom:ALTIS.maxZoom,attribution:'&copy; Bohemia Interactive · Altis map via Arma3Map'}).addTo(map);
map.setView(ALTIS.center,ALTIS.defaultZoom);
let labelLayer=L.layerGroup().addTo(map),labelsOn=true;
for(const [name,x,y] of cities){const m=L.circleMarker([y,x],{radius:3,weight:1,color:'#b9d765',fillColor:'#0b120d',fillOpacity:.95,opacity:.95});m.bindTooltip(name,{permanent:true,direction:'top',offset:[0,-4],className:'city-label'});m.addTo(labelLayer)}
let gridLayer=null; if(L.latlngGraticule){gridLayer=L.latlngGraticule();gridLayer.addTo(map)}
const coord=document.getElementById('coord');map.on('mousemove',e=>{coord.textContent='ALTIS/MGRS: '+String(Math.round(e.latlng.lng)).padStart(5,'0')+' - '+String(Math.round(e.latlng.lat)).padStart(5,'0')});
document.getElementById('cities').onclick=e=>{labelsOn=!labelsOn;e.currentTarget.classList.toggle('active',labelsOn);if(labelsOn)labelLayer.addTo(map);else map.removeLayer(labelLayer)};
document.getElementById('grid').onclick=e=>{e.currentTarget.classList.toggle('active');if(!gridLayer)return;if(e.currentTarget.classList.contains('active'))gridLayer.addTo(map);else map.removeLayer(gridLayer)};
document.getElementById('reset').onclick=()=>map.setView(ALTIS.center,ALTIS.defaultZoom);
document.getElementById('full').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};
</script>
</body>
</html>
